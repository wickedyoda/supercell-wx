# Android/Gradle defaults for Supercell Wx

# Use AndroidX where possible
android.useAndroidX=true
android.enableJetifier=false

# Keep generated resources lean
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Gradle JVM tuning for Qt Android builds
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Signing config is injected from a local file or environment variables.
# See release-signing.properties.example for the expected keys.
